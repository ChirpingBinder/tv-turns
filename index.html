<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>TV Turns</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="apple-touch-icon" href="icon.png">
</head>

<body>

    <main class="app">

        <header class="header">
            <h1>TV Turns</h1>
            <p>Split your TV time automatically.</p>
        </header>

        <section class="card">

            <div class="fields-row">

    <div class="field">
        <label for="startTime">Starts</label>
        <input type="time" id="startTime" value="06:31">
    </div>

    <div class="field">
        <label for="endTime">Ends</label>
        <input type="time" id="endTime" value="07:45">
    </div>

    <div class="field">
        <label for="kids">Kids</label>
        <select id="kids">
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
    </div>

</div>

            <button id="calculateButton">Calculate Turns</button>

        </section>

        <section id="results" class="results hidden">

            <div class="results-header">
                <h2>TV Turns</h2>
                <button id="resetButton" class="reset-button">Reset</button>
            </div>

            <div id="turnList"></div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
